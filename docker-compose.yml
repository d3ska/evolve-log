services:
  postgres:
    image: postgres:17-alpine
    container_name: evolvelog-postgres
    environment:
      POSTGRES_DB: evolvelog
      POSTGRES_USER: evolvelog
      POSTGRES_PASSWORD: evolvelog_dev
    ports:
      - "5432:5432"
    volumes:
      - evolvelog_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolvelog"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  evolvelog_data:
