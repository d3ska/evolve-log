spring.application.name=evolve-log
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/evolvelog}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:evolvelog}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:evolvelog_dev}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Server
server.port=8080
server.forward-headers-strategy=native
server.error.include-message=never
server.error.include-stacktrace=never

# Actuator
management.endpoints.web.exposure.include=health

# Multipart (photos ≤10MB, videos ≤200MB)
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=205MB

# File storage (custom)
app.storage.type=local
app.storage.local.upload-dir=uploads

# Frontend URL
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}

# Withings OAuth
withings.client-id=${WITHINGS_CLIENT_ID:}
withings.client-secret=${WITHINGS_CLIENT_SECRET:}
withings.redirect-uri=${app.frontend-url}/auth/withings/callback

# Google OAuth
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}

# AI encryption (AES-256, must be exactly 32 bytes when Base64-decoded)
ai.encryption.key=${APP_AI_ENCRYPTION_KEY:}
