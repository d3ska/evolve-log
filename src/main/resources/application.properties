spring.application.name=evolve-log
spring.profiles.active=local

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/evolvelog
spring.datasource.username=evolvelog
spring.datasource.password=evolvelog_dev
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Server
server.port=8080
server.error.include-message=never
server.error.include-stacktrace=never

# Actuator
management.endpoints.web.exposure.include=health

# Multipart (photos ≤10MB, videos ≤200MB)
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=205MB

# File storage (custom)
app.storage.type=local
app.storage.local.upload-dir=uploads

# Withings OAuth
withings.client-id=${WITHINGS_CLIENT_ID:}
withings.client-secret=${WITHINGS_CLIENT_SECRET:}
app.frontend-url=http://localhost:5173
withings.redirect-uri=${app.frontend-url}/auth/withings/callback
